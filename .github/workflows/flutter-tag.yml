name: Flutter Tag Build

on:
  workflow_dispatch:
  push:
    tags:
      # glob 语法：`*` 通配，`[0-9]` 单字符（上游原写法 `[0-9]+` 的 `+` 是字面量，匹配不到版本号）
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}
      windows-only: true